# deploy/kubernetes/hpa.yaml — auto-scaling
# Scales based on CPU usage (60% target) AND request denial rate
# Min 3 replicas (high availability), max 20 (cost control)
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: rate-limiter-hpa
  labels:
    app: rate-limiter
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: rate-limiter
  minReplicas: 3
  maxReplicas: 20
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 60
  - type: Pods
    pods:
      metric:
        name: rate_limiter_requests_denied
      target:
        type: AverageValue
        averageValue: "10"
