# .goreleaser.yaml — automated release configuration
# Triggers on git tag, builds all platforms, creates GitHub Release with checksums
before:
  hooks:
    - go mod tidy
builds:
  - id: rate-limiter
    main: ./cmd/rate-limiter
    binary: rate-limiter
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{.Version}}
archives:
  - formats:
      - zip
      - tar.gz
checksum:
  name_template: 'checksums.txt'
snapshot:
  name_template: "{{ .Tag }}-next"
changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
